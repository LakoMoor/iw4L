[package]
name = "iw4pk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "IW4PK: range-readable, per-block zstd pack of the game files a browser session needs."

[features]
# Native-only: the encoder (C zstd). The reader is pure Rust and builds for wasm.
write = ["dep:zstd", "dep:sha2", "dep:zip"]

[[bin]]
name = "iw4pk"
path = "src/bin/iw4pk.rs"
required-features = ["write"]

[dependencies]
ruzstd = "0.8"
zstd = { version = "0.13", optional = true }
sha2 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[lints]
workspace = true
