<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IW4L — Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f0a;--panel:rgba(8,10,6,.82);--edge:#59604a;--text:#e9eadf;--dim:#a3a892;--amber:#f0a30a;--amber-d:#b97a00;--red:#d8442a;--ok:#9bb25b;
  --display:"Russo One","Arial Narrow",Impact,sans-serif;--body:"Exo 2",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 1rem/1.5 var(--body)}
#iw4l-canvas{position:fixed;inset:0;width:100%;height:100%;display:none;outline:none}
body.running #iw4l-canvas{display:block}
body.running #gate{display:none}
#gate{min-height:100%;display:grid;place-items:center;padding:1.5rem;
  background:radial-gradient(120% 80% at 70% 0%,rgba(120,128,92,.28),transparent 60%),linear-gradient(180deg,#12150d,#0a0b07)}
.card{width:min(40rem,100%);background:var(--panel);border:1px solid var(--edge);padding:1.5rem;position:relative}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--amber)}
.card::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.card::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
h1{font:400 1.8rem/1 var(--display);margin:0 0 .5rem;letter-spacing:.04em}
p{color:var(--dim);margin:.4rem 0 1rem}
.btn{appearance:none;border:1px solid var(--amber);background:linear-gradient(180deg,var(--amber),var(--amber-d));color:#150e00;font:400 1.05rem var(--display);letter-spacing:.05em;padding:.75rem 1.4rem;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--amber)}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin:.8rem 0}
progress{width:100%;height:.9rem;accent-color:var(--amber)}
#log{font:.82rem/1.4 ui-monospace,Consolas,monospace;color:var(--dim);max-height:11rem;overflow:auto;white-space:pre-wrap;border-top:1px solid var(--edge);padding-top:.6rem;margin-top:1rem}
#log .err{color:var(--red)}
a{color:var(--amber)}
select{background:#10130b;color:var(--text);border:1px solid var(--edge);padding:.5rem .7rem;font:inherit}
label{color:var(--dim)}
</style>
</head>
<body>
<canvas id="iw4l-canvas" tabindex="0"></canvas>
<main id="gate"><div class="card">
  <h1>IW4L — Play</h1>
  <p>Load the game pack and start. The pack is built from your own copy of MW2 and stays in this browser tab; nothing is uploaded.</p>
  <div class="row">
    <label class="btn ghost" for="packs">Choose game file</label>
    <input id="packs" type="file" accept=".iw4pk" hidden>
    <span id="picked">no file selected</span>
  </div>
  <div class="row">
    <label for="map">Map</label>
    <select id="map"><option value="mp_rust">Rust</option><option value="mp_boneyard">Scrapyard</option><option value="mp_terminal">Terminal</option><option value="mp_favela">Favela</option></select>
  </div>
  <div class="row"><button class="btn" id="start" disabled>Start</button></div>
  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="log" role="log" aria-live="polite"></div>
  <p style="margin-top:1rem"><a href="./">Back to the project page</a></p>
</div></main>
<script type="module" src="./play.js"></script>
</body>
</html>
